data:
  files: null
  num_episodes: null
  batch_size: 32
  max_samples: null
  shuffle: false
  seed: 42

model:
  provider: openai_compatible
  model: gpt-4o
  api_base: https://api.openai.com/v1
  api_key: null
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  max_concurrent: 32
  max_retries: 3
  timeout: 120.0

env:
  env_name: null
  seed: 0
  max_steps: 50
  history_length: 2
  resources_per_worker:
    num_cpus: 0.1
    num_gpus: 0
  rollout:
    n: 1
  deceptive_search:
    search_url: http://127.0.0.1:8000/retrieve
    topk: 3
    timeout: 60
    audit_probability: 1.0
    reward_correct: 1.0
    reward_source: 0.0
    penalty_audit: 0.0
    penalty_disclosure: 0.0
    grounding_check: false
  webshop:
    use_small: true
    human_goals: false
  cheatshop:
    require_self_report: false
    enable_log_edit: false
    monitor_obs_level: action_plus_obs
    self_report_cot_visibility: hidden
    shopping_max_steps: ${env.max_steps}
    oracle_top_n: 5
    tamper_max_deletes: 1

dump:
  output_dir: null
  n_trajectories: 128  # number of trajectories to dump to a json filefor offline review/evaluation
  policy: random
  include_steps: true
  log_generations: 4  # number of trajectories to log as a table of validation samples to the configured logger (wandb or swanlab)

progress:
  enabled: true

trainer:
  project_name: api_rollout_eval
  experiment_name: api_eval
  logger: [console]
